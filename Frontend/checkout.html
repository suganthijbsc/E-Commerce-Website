<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopEase - Checkout</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- NAVBAR -->

    <header>

        <nav>

            <div class="logo">
                ShopEase
            </div>

            <div class="nav-links">

                <a href="index.html">Home</a>

                <a href="product.html">Products</a>
                <a href="my-orders.html">My Orders</a>
                <a href="index.html">Categories</a>

                <a href="index.html">Offers</a>

            </div>

            <div class="nav-actions">

                <a href="login.html" id="loginLink">Login</a>

                <a href="cart.html">
                    Cart 🛒
                    <span id="cartCount">0</span>
                </a>

            </div>

        </nav>

    </header>


    <!-- CHECKOUT -->

    <section class="checkout-section">

        <h1>Checkout</h1>

        <div class="checkout-container">


            <!-- CUSTOMER DETAILS -->

            <div class="checkout-form">

                <h2>Customer Details</h2>

                <div class="form-group">
                     <label for="Id">
                        Customer ID
                    </label>
                      <input
                        type="text"
                        id="customerId"
                        placeholder="Customer ID"
                        value="C0001">
                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                    >

                </div>


                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="Enter your address">
                    </textarea>

                </div>


                <button
                    id="placeOrderBtn"
                    type="button">

                    Place Order

                </button>

            </div>


            <!-- ORDER SUMMARY -->

            <div class="checkout-summary">

                <h2>Order Summary</h2>

                <div id="checkoutItems">
                </div>

                <hr>

                <div class="summary-row">

                    <span>Subtotal</span>

                    <span id="checkoutSubtotal">
                        ₹0
                    </span>

                </div>

                <div class="summary-row">

                    <span>Shipping</span>

                    <span>
                        ₹0
                    </span>

                </div>

                <div class="summary-row total">

                    <span>Total</span>

                    <span id="checkoutTotal">
                        ₹0
                    </span>

                </div>

            </div>

        </div>

    </section>


    <script src="js/script.js"></script>

</body>

</html>
